services:
  postgres-auth:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_service
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD}
    ports: ["5432:5432"]
    volumes: ["pg-auth:/var/lib/postgresql/data"]

  postgres-user:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: user_service
      POSTGRES_PASSWORD: ${POSTGRES_USER_PASSWORD}
    ports: ["5433:5432"]
    volumes: ["pg-user:/var/lib/postgresql/data"]

  postgres-notification:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: notification_service
      POSTGRES_PASSWORD: ${POSTGRES_NOTIFICATION_PASSWORD}
    ports: ["5434:5432"]
    volumes: ["pg-notification:/var/lib/postgresql/data"]

  postgres-attachment:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: attachment_db
      POSTGRES_USER: attachment_service
      POSTGRES_PASSWORD: ${POSTGRES_ATTACHMENT_PASSWORD}
    ports: ["5436:5432"]
    volumes: ["pg-attachment:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  kafka:
    image: apache/kafka:4.1.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  minio:
    image: pgsty/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: [ "9000:9000", "9001:9001" ]
    volumes: [ "minio-data:/data" ]
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    image: pgsty/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ATTACHMENT_BUCKET: ${MINIO_ATTACHMENT_BUCKET:-badrlink-attachments}
      MINIO_QUARANTINE_BUCKET: ${MINIO_QUARANTINE_BUCKET:-badrlink-quarantine}
    entrypoint:
      - sh
      - -c
      - |
        set -e
        mc alias set badrlink http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "badrlink/$$MINIO_ATTACHMENT_BUCKET"
        mc mb --ignore-existing "badrlink/$$MINIO_QUARANTINE_BUCKET"
        mc anonymous set none "badrlink/$$MINIO_ATTACHMENT_BUCKET"
        mc anonymous set none "badrlink/$$MINIO_QUARANTINE_BUCKET"
        echo "Attachment buckets are ready and private."

  mongodb:
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all", "--keyFile", "/keyfile/keyfile"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: messaging_chat
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db", "mongo-keyfile:/keyfile"]
    depends_on:
      mongo-keyfile-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - 'mongosh --quiet --host localhost:27017 --username root --password "$${MONGO_ROOT_PASSWORD}" --authenticationDatabase admin --eval ''db.runCommand({ ping: 1 }).ok'' || exit 1'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  mongodb-init:
    image: mongo:8
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "on-failure"
    environment:
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    entrypoint:
      - bash
      - -c
      - |
        set -e
        mongosh --quiet \
          --host mongodb:27017 \
          --username root \
          --password "$$MONGO_ROOT_PASSWORD" \
          --authenticationDatabase admin \
          --eval '
            try {
              rs.status()
            } catch (error) {
              rs.initiate({
                _id: "rs0",
                members: [{ _id: 0, host: "localhost:27017" }]
              })
            }
          '

  mongo-keyfile-init:
    image: mongo:8
    user: "0:0"
    entrypoint:
      - bash
      - -c
      - |
        set -e
        if [ ! -s /keyfile/keyfile ]; then
          head -c 756 /dev/urandom | base64 > /keyfile/keyfile
        fi
        chown 999:999 /keyfile/keyfile
        chmod 400 /keyfile/keyfile
        echo "MongoDB key file prepared."
    volumes:
      - mongo-keyfile:/keyfile
    restart: "no"

volumes:
  pg-auth:
  pg-user:
  pg-notification:
  pg-attachment:
  mongo-data:
  mongo-keyfile:
  minio-data: