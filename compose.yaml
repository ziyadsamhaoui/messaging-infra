
name: badrlink-infra

services:
  postgres-auth:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_service
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD}
    ports: ["5432:5432"]
    volumes: ["pg-auth:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_service -d auth_db"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [badrlink-net]

  postgres-user:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: user_service
      POSTGRES_PASSWORD: ${POSTGRES_USER_PASSWORD}
    ports: ["5433:5432"]
    volumes: ["pg-user:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_service -d user_db"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [badrlink-net]

  postgres-notification:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: notification_service
      POSTGRES_PASSWORD: ${POSTGRES_NOTIFICATION_PASSWORD}
    ports: ["5434:5432"]
    volumes: ["pg-notification:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_service -d notification_db"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [badrlink-net]

  postgres-attachment:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: attachment_db
      POSTGRES_USER: attachment_service
      POSTGRES_PASSWORD: ${POSTGRES_ATTACHMENT_PASSWORD}
    ports: ["5436:5432"]
    volumes: ["pg-attachment:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attachment_service -d attachment_db"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [badrlink-net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [badrlink-net]

  kafka:
    image: apache/kafka:4.1.1
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes: ["kafka-data:/tmp/kraft-combined-logs"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks: [badrlink-net]

  minio:
    image: pgsty/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: [ "9000:9000", "9001:9001" ]
    volumes: [ "minio-data:/data" ]
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [badrlink-net]

  minio-init:
    image: pgsty/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ATTACHMENT_BUCKET: ${MINIO_ATTACHMENT_BUCKET:-badrlink-attachments}
      MINIO_QUARANTINE_BUCKET: ${MINIO_QUARANTINE_BUCKET:-badrlink-quarantine}
    entrypoint:
      - sh
      - -c
      - |
        set -e
        mc alias set badrlink http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "badrlink/$$MINIO_ATTACHMENT_BUCKET"
        mc mb --ignore-existing "badrlink/$$MINIO_QUARANTINE_BUCKET"
        mc anonymous set none "badrlink/$$MINIO_ATTACHMENT_BUCKET"
        mc anonymous set none "badrlink/$$MINIO_QUARANTINE_BUCKET"
        echo "Attachment buckets are ready and private."
    networks: [badrlink-net]

  mongodb:
    image: mongo:8
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--keyFile", "/keyfile/keyfile"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: messaging_chat
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db", "mongo-keyfile:/keyfile"]
    depends_on:
      mongo-keyfile-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - 'mongosh --quiet --host localhost:27017 --username root --password "$${MONGO_ROOT_PASSWORD}" --authenticationDatabase admin --eval ''db.runCommand({ ping: 1 }).ok'' || exit 1'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [badrlink-net]

  mongodb-init:
    image: mongo:8
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "on-failure"
    environment:
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    entrypoint:
      - bash
      - -c
      - |
        set -e
        # The advertised member host must be the name clients dial. `mongodb` is
        # what containers use, and containers are the supported topology now.
        # Host tools that need the replica set should use:
        #   mongodb://root:...@localhost:27017/messaging_chat?authSource=admin&directConnection=true
        mongosh --quiet \
          --host mongodb:27017 \
          --username root \
          --password "$$MONGO_ROOT_PASSWORD" \
          --authenticationDatabase admin \
          --eval '
            try {
              rs.status()
            } catch (error) {
              rs.initiate({
                _id: "rs0",
                members: [{ _id: 0, host: "mongodb:27017" }]
              })
            }
          '
    networks: [badrlink-net]

  mongo-keyfile-init:
    image: mongo:8
    user: "0:0"
    entrypoint:
      - bash
      - -c
      - |
        set -e
        if [ ! -s /keyfile/keyfile ]; then
          head -c 756 /dev/urandom | base64 > /keyfile/keyfile
        fi
        chown 999:999 /keyfile/keyfile
        chmod 400 /keyfile/keyfile
        echo "MongoDB key file prepared."
    volumes:
      - mongo-keyfile:/keyfile
    restart: "no"
    networks: [badrlink-net]


  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
    ports:
      - "16686:16686"
      - "4317:4317"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:14269/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [badrlink-net]

  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - "./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro"
      - "prometheus-data:/prometheus"
    ports: ["9091:9090"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [badrlink-net]

  loki:
    image: grafana/loki:3.7.9
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - "./observability/loki/config.yaml:/etc/loki/config.yaml:ro"
      - "loki-data:/loki"
    ports: ["3100:3100"]
    networks: [badrlink-net]

  promtail:
    image: grafana/promtail:3.6.11
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yaml"]
    volumes:
      - "./observability/promtail/config.yaml:/etc/promtail/config.yaml:ro"
      - "/var/lib/docker/containers:/var/lib/docker/containers:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "promtail-positions:/positions"
    depends_on:
      loki:
        condition: service_started
    networks: [badrlink-net]

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/system-overview.json
    volumes:
      - "./observability/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro"
      - "grafana-data:/var/lib/grafana"
    ports: ["3001:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [badrlink-net]

networks:
  badrlink-net:
    name: badrlink-net

volumes:
  pg-auth:
  pg-user:
  pg-notification:
  pg-attachment:
  mongo-data:
  mongo-keyfile:
  minio-data:
  redis-data:
  kafka-data:
  prometheus-data:
  loki-data:
  grafana-data:
  promtail-positions:
