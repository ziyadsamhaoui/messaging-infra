# Promtail ships the JSON logs the seven services write to stdout.
#
# Collection uses Docker service discovery over the daemon socket instead of a
# hard-coded path glob: the container id changes on every restart and the
# Compose project name decides the directory, so the socket is the only stable
# source of truth for "which log file belongs to which service".
#
# trace_id/span_id are not stream labels. They are structured metadata, which
# keeps the stream count bounded while still allowing `{trace_id="..."}`
# filtering in Loki and Grafana.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: badrlink-services
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["com.docker.compose.project=badrlink-apps"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        regex: "gateway|auth|user|chat|realtime|notification|attachment"
        action: keep
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - target_label: environment
        replacement: local
      - target_label: job
        replacement: badrlink-services
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger_name
            trace_id: trace_id
            span_id: span_id
            correlation_id: correlationId
      # `level` is low cardinality and useful for filtering whole streams.
      - labels:
          level:
      # Identifiers stay queryable but never become stream labels.
      - structured_metadata:
          trace_id:
          span_id:
          correlation_id:
