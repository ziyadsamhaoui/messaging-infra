
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: badrlink-services
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["com.docker.compose.project=badrlink-apps"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        regex: "gateway|auth|user|chat|realtime|notification|attachment"
        action: keep
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - target_label: environment
        replacement: local
      - target_label: job
        replacement: badrlink-services
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger_name
            trace_id: trace_id
            span_id: span_id
            correlation_id: correlationId
      - labels:
          level:
      - structured_metadata:
          trace_id:
          span_id:
          correlation_id:
