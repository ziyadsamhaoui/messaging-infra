apiVersion: 1

datasources:
  - name: Prometheus
    uid: badrlink-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
      httpMethod: POST

  - name: Loki
    uid: badrlink-loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 2000
      derivedFields:
        - name: TraceID
          matcherType: regex
          matcherRegex: '"trace_id":"([0-9a-f]{32})"'
          url: "$${__value.raw}"
          datasourceUid: badrlink-jaeger

  - name: Jaeger
    uid: badrlink-jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
