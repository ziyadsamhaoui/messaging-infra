# Dashboard provider. Re-provisioning is enabled so a dashboard edited in the
# UI is overwritten on restart by the version-controlled JSON next to it.
apiVersion: 1

providers:
  - name: badrlink
    orgId: 1
    folder: BadrLink
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
